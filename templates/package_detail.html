<!DOCTYPE html>
<html><head><title>Package Detail</title><style>
body{font-family:Arial;background:#e8eef5;padding:20px;margin:0}
.box{background:white;max-width:800px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.08)}
h1{color:#334155;margin:0}
p{color:#475569;font-size:17px}
.btn{background:#64748b;color:white;padding:9px 16px;border-radius:8px;text-decoration:none;display:inline-block;margin-right:8px}
.info{background:#f8fafc;border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:12px 0}
</style></head><body><div class="box">
{% set item = p if p is defined else package %}
<h1>{{ item.tracking_no }}</h1>
<div class="info">
<p><b>Customer:</b> {{ item.customer_name }}</p>
<p><b>Status:</b> {{ item.status }}</p>
<p><b>From:</b> {{ item.origin }} &nbsp; <b>To:</b> {{ item.destination }}</p>
</div>
<a class="btn" href="/track/{{ item.tracking_no }}">Track</a>
<a class="btn" href="/packages">Back</a>
</div></body></html>
