<!DOCTYPE html>
<html>
<head>
    <title>LDTS - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            margin: 0;
            background: #0B2C4A;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            width: 420px;
            max-width: 92%;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 5px;
        }
        h1 {
            color: #0B2C4A;
            font-size: 32px;
            margin: 5px 0 5px 0;
        }
        p.subtitle {
            color: #666;
            font-size: 18px;
            margin: 0 0 25px 0;
        }
        label {
            display: block;
            text-align: left;
            font-size: 18px;
            font-weight: bold;
            color: #0B2C4A;
            margin: 15px 0 6px 0;
        }
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }
        input:focus { border-color: #FF7A00; }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: #0B2C4A;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover { background: #082033; }
        a {
            display: block;
            margin-top: 20px;
            font-size: 17px;
            color: #0B2C4A;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🚚</div>
        <h1>LDTS Admin Login</h1>
        <p class="subtitle">Logistics & Delivery Tracking System</p>

        <form method="POST" action="/login">
            <label>Username</label>
            <input type="text" name="username" value="admin" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <a href="/track">Customer? Track a package here</a>
    </div>
</body>
</html>
