<!DOCTYPE html>
<html><head><title>Add Driver</title><style>
body{font-family:Arial;background:#e8eef5;padding:20px;margin:0}
.box{background:white;max-width:600px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.08)}
h1{color:#334155}
label{color:#475569;font-weight:bold}
input{width:100%;padding:12px;margin:8px 0 15px 0;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;font-size:16px}
button{background:#64748b;color:white;padding:12px 20px;border:none;border-radius:8px;font-size:16px;width:100%}
.btn{background:#e2e8f0;color:#334155;padding:9px 16px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:10px}
</style></head><body><div class="box">
<h1>Add Driver</h1>
<form method="POST">
<label>Name:</label><br>
<input name="name" required><br>
<label>Phone:</label><br>
<input name="phone"><br>
<button>Create</button>
</form>
<a class="btn" href="/drivers">Back to Drivers</a>
</div></body></html>
