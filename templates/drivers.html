<!DOCTYPE html>
<html><head><title>Drivers</title><style>
body{font-family:Arial;background:#e8eef5;padding:20px;margin:0}
.box{background:white;max-width:800px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.08)}
h1{color:#334155;margin:0 0 15px 0}
.btn{background:#64748b;color:white;padding:9px 16px;border-radius:8px;text-decoration:none;display:inline-block;margin-right:8px}
.card{background:#f8fafc;border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:10px 0}
p{color:#475569;margin:4px 0}
</style></head><body><div class="box">
<h1>Drivers</h1>
<a class="btn" href="/drivers/new">Add Driver</a>
<a class="btn" href="/">Home</a><br><br>
{% for d in drivers %}
<div class="card">
<p><b>{{ d['name'] }}</b> - {{ d['status'] }}</p>
<p>Phone: {{ d['phone'] }}</p>
<form method="POST" action="/drivers/delete/{{ d['id'] }}" onsubmit="return confirm('Remove this driver?')"><button style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer">Remove</button></form>
</div>
{% else %}
<p>No drivers yet.</p>
{% endfor %}
</div></body></html>
